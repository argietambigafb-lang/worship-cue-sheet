<title>Worship Cue Sheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column that behaves like an app. Songs and Setlists tabs on a bottom dock,
   a full-screen play view with a lyrics sheet and a fixed metronome dock. */
:root{
  --bg:#F2F5F8; --outer:#E1E8EF; --surface:#FFFFFF; --ink:#0F1B2A; --muted:#566779; --line:#D5DDE6;
  --soft:#E6EEF4; --accent:#0A6A8A; --on-accent:#FFFFFF; --beat:#D9482B; --on-beat:#FFFFFF; --danger:#B3261E;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C141D; --outer:#060B11; --surface:#152131; --ink:#E8EEF4; --muted:#93A3B5; --line:#24354A;
    --soft:#1B2B3E; --accent:#5CC8EC; --on-accent:#04222D; --beat:#FF7A59; --on-beat:#2A0E06; --danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C141D; --outer:#060B11; --surface:#152131; --ink:#E8EEF4; --muted:#93A3B5; --line:#24354A;
  --soft:#1B2B3E; --accent:#5CC8EC; --on-accent:#04222D; --beat:#FF7A59; --on-beat:#2A0E06; --danger:#FF8A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;max-width:520px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;gap:12px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:560px){.app{border-inline:1px solid var(--line)}}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{margin:0;font:800 28px/1.05 var(--f-display);letter-spacing:-.02em}
.top .sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.top .grow{flex:1;min-width:0}

.btn{font:600 14px var(--f-body);height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.big{height:48px;font-size:15px;width:100%}
.btn:disabled,.ib:disabled{opacity:.4;cursor:default}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0;font:700 14px var(--f-body)}
.ib.sm{width:36px;height:36px}
.ib[aria-pressed="true"]{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;font:700 13px var(--f-body);color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

input,select,textarea{font:500 16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px;width:100%;min-width:0}
textarea{height:auto;padding:12px;font:500 15px/1.5 var(--f-mono);resize:vertical}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--accent)}
label,.lbl{display:block;font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.backup-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.backup-actions .btn{height:34px;padding:0 10px;font-size:12px}
.backup-actions .btn{flex:1}
.set-export-actions{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.set-export-actions .btn{flex:1}
.menu-actions{display:grid;gap:8px;margin-top:8px}
.menu-actions .btn{width:100%;justify-content:flex-start;height:46px}
.menu-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 0}
.stage-info{display:none;gap:8px;align-items:stretch}
.stage-info .stage-stat{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stage-stat small{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.stage-stat strong{display:block;font:700 17px var(--f-mono);overflow-wrap:anywhere}
.app.stage-mode{max-width:none;padding:12px;gap:8px}
.app.stage-mode .phead .ib:first-child,.app.stage-mode .phead .ib:last-child{display:none}
.app.stage-mode .ptitle h2{font-size:clamp(24px,4vw,38px);white-space:normal}
.app.stage-mode .stage-info{display:flex}
.app.stage-mode #lyrics{font-size:clamp(26px,4.2vw,46px)!important;line-height:1.3;padding-bottom:20px}
.app.stage-mode #lyrics .sec span{font-size:.55em}
.app.stage-mode .tools{gap:6px}
.app.stage-mode .dock{padding:8px}
@media (orientation:landscape){.app.stage-mode{height:100dvh}.app.stage-mode #lyrics{font-size:clamp(22px,3.4vw,38px)!important}}
.empty{padding:32px 8px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font:700 17px var(--f-display);margin-bottom:4px}

.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;display:block}
.r-title{display:block;font:700 17px/1.2 var(--f-display);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-meta{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.tag{font:600 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:8px;vertical-align:middle;font-style:normal}
.pill{font:600 13px var(--f-mono);padding:4px 8px;border-radius:8px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.key{color:var(--accent)}
.r-info{display:flex;gap:6px;flex:none}
.add.on{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.addto{margin:0;font-size:13px;color:var(--muted)}
ul.list{list-style:none;margin:0;padding:0}

.item{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item .idx{font:700 15px var(--f-mono);color:var(--muted);text-align:center}
.item .acts{grid-column:2 / 4;display:flex;justify-content:flex-end;gap:6px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--f-body);cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.setbar{display:flex;gap:8px}

.tabs{display:flex;gap:6px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.tab{flex:1;height:44px;border:0;border-radius:10px;background:none;display:flex;align-items:center;justify-content:center;gap:8px;font:700 14px var(--f-body);color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{background:var(--soft);color:var(--accent)}

/* play view */
.phead{display:flex;align-items:center;gap:10px}
.ptitle{flex:1;min-width:0}
.ptitle h2{margin:0;font:800 21px/1.1 var(--f-display);letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptitle p{margin:2px 0 0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.keybox{display:flex;align-items:center;gap:6px}
.keypill{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:8px;cursor:pointer}
.k-label{font:700 10px var(--f-body);letter-spacing:.12em;color:var(--muted)}
#keyname{font:700 20px var(--f-mono);color:var(--accent)}
.trb{font-size:12px;color:var(--muted);font-weight:600}
.tools-r{display:flex;gap:6px}
.cs{font-size:var(--fs,20px);line-height:1.2;padding:2px 2px 60px}
.cs .gap{height:.7em}
.cs .ln{margin:0 0 .3em}
.cs .s{display:inline-flex;flex-direction:column;vertical-align:top}
.cs .c{font:600 .8em/1.55 var(--f-mono);color:var(--accent);height:1.55em;padding-right:.6em;white-space:pre}
.cs .l{white-space:pre-wrap;line-height:1.35;font-weight:500}
.cs .nochord .c{display:none}
.cs .conly .l{display:none}
.cs.nochords .c{display:none}
.cs.nochords .conly{display:none}
.cs .sec{margin:1.2em 0 .5em}
.cs .sec span{display:inline-block;font:700 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--soft);padding:6px 9px;border-radius:6px}

.dock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px}
.metro{display:flex;align-items:center;gap:10px}
.mbtn{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;flex:none}
.mbtn.on{background:var(--beat);color:var(--on-beat)}
.dots{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;min-width:0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--soft);border:1px solid var(--line);transition:transform .06s}
.dots i:first-child{width:18px;height:18px}
.dots i.hit{background:var(--beat);border-color:var(--beat);transform:scale(1.2)}

.phead-actions{display:flex;align-items:center;gap:8px}.phead-actions .btn{white-space:nowrap;min-height:40px}.btn:disabled{opacity:.55;cursor:default}.dialog-backdrop{position:fixed;inset:0;z-index:1000;background:#07111dcc;display:flex;align-items:center;justify-content:center;padding:20px}.dialog-card{width:min(100%,380px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 20px 60px #0004}.dialog-card h2{margin:0 0 8px;font-size:20px}.dialog-card p{margin:0 0 18px;color:var(--muted)}.dialog-actions{display:grid;gap:8px}.dialog-actions .btn{min-height:42px}
.audio-settings{border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.audio-settings summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;cursor:pointer;list-style:none;font:700 13px var(--f-body);color:var(--ink)}
.audio-settings summary::-webkit-details-marker{display:none}
.audio-settings summary::after{content:'＋';font-size:18px;color:var(--muted)}
.audio-settings[open] summary::after{content:'−'}
.audio-settings .audio-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 0 2px}
.audio-settings .audio-control{min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--soft)}
.audio-settings .audio-control label{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;font-weight:700;margin-bottom:7px}
.audio-settings .audio-control input[type=range]{display:block;width:100%;min-height:24px;accent-color:var(--accent)}
.audio-settings .audio-control select{width:100%;min-height:34px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.audio-toggle{width:100%;min-height:36px;padding:7px 9px;display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font:700 12px var(--f-body);color:var(--ink)}
.audio-toggle[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.audio-toggle .toggle-state{font:700 10px var(--f-mono);padding:3px 6px;border-radius:6px;background:var(--soft)}
.audio-toggle[aria-pressed=true] .toggle-state{background:var(--accent);color:var(--on-accent)}
.audio-settings .audio-note{grid-column:1/-1;margin:0;color:var(--muted);font-size:11px;line-height:1.35}
.bpmbox button:disabled{opacity:.25;pointer-events:none}
@media(max-width:380px){.audio-settings .audio-controls{gap:7px}.audio-settings .audio-control{padding:7px}}

.bpmbox{display:flex;align-items:center;gap:6px;flex:none}
.bpmv{text-align:center;min-width:64px}
.bpmv input{display:block;width:64px;max-width:100%;padding:2px 0;border:0;border-radius:6px;background:transparent;color:var(--ink);text-align:center;font:700 22px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;outline-offset:3px}.bpmv input:focus{background:var(--soft)}.bpmv input:disabled{opacity:.7}
.bpmv small{font-size:11px;color:var(--muted);font-weight:600}
.nav{display:flex;align-items:center;gap:8px}
.nav .ib{width:46px;height:46px}
.next{flex:1;min-width:0;height:46px;justify-content:space-between}
.next span{overflow:hidden;text-overflow:ellipsis}
.switch{display:flex;align-items:center;gap:8px;border:0;background:none;font:600 11px/1.15 var(--f-body);color:var(--muted);cursor:pointer;padding:0 2px;height:46px;text-align:left}
.sw{width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"] .sw{background:var(--accent)}
.switch[aria-checked="true"] .sw::after{transform:translateX(14px)}
.switch[aria-checked="true"]{color:var(--ink)}

/* editor */
.form{display:grid;gap:14px;align-content:start;padding-bottom:24px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.inline{display:flex;gap:8px;align-items:center}
.chk{display:flex;align-items:center;gap:6px;margin:0;font:600 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink);white-space:nowrap}
.hint{margin:0;font-size:13px;color:var(--muted)}
.hint code{font-family:var(--f-mono);font-size:12px;background:var(--soft);padding:1px 5px;border-radius:5px;color:var(--ink)}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;--fs:17px;overflow-x:auto}

.convrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.note{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.35}
.note .linkbtn+.linkbtn{margin-left:14px}

/* overlay + toast */
#overlay{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.pop{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;
  padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pop h3{margin:0 0 12px;font:800 20px var(--f-display)}
.pop{max-height:88%;overflow-y:auto}
.pop .pk-song{margin:-6px 0 12px}
.picklist{display:grid;gap:8px;max-height:40vh;overflow-y:auto;margin-bottom:12px}
.pick{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;width:100%}
.pick .pk-name{flex:1;min-width:0;font:700 16px var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .pk-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.pick .pk-box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--on-accent)}
.pick .pk-box svg{width:16px;height:16px}
.pick.on{border-color:var(--accent)}
.pick.on .pk-box{background:var(--accent);border-color:var(--accent)}
.newset{display:flex;gap:8px;margin-bottom:12px}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}
.addrow{display:flex;gap:8px}
.addrow .btn{flex:1}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kgrid button{height:52px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:700 18px var(--f-mono);color:var(--ink);cursor:pointer}
.kgrid button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.pop .hint{margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font:600 14px var(--f-body);opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:50;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Mobile-first app feel ---------- */
html { height:100%; height:100dvh; }
body {
  min-height:100%;
  min-height:100dvh;
  overscroll-behavior:none;
}
.app {
  width:100%;
  height:100%;
  height:100dvh;
  max-width:520px;
  min-height:0;
  margin:0 auto;
  padding-top:max(10px, env(safe-area-inset-top, 0px));
  padding-bottom:max(8px, env(safe-area-inset-bottom, 0px));
  gap:10px;
  overflow:hidden;
}
.app > .scroll { overscroll-behavior:contain; scrollbar-width:thin; }
button, .chip, .keypill, .switch { touch-action:manipulation; }
.btn, .ib, .tab, .chip, .keypill { -webkit-user-select:none; user-select:none; }
.btn { min-height:44px; }
.ib { min-width:44px; min-height:44px; }
.ib.sm { min-width:40px; min-height:40px; }
.tabs {
  flex:none;
  position:relative;
  z-index:5;
  margin-top:0;
  padding:5px;
  border-radius:16px;
  box-shadow:0 -4px 18px rgba(0,0,0,.035);
}
.tab { min-height:48px; height:48px; flex-direction:column; gap:2px; font-size:12px; }
.tab svg { width:20px; height:20px; }
.top { flex:none; }
.top h1 { font-size:clamp(25px, 7vw, 30px); }
#q { flex:none; }
.row { gap:8px; }
.r-title { font-size:16px; }
.r-meta { font-size:12px; }
.setbar, .addrow, .set-export-actions { flex:none; }
.chips { flex:none; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.scroll { min-height:0; }
.dock {
  flex:none;
  padding:9px;
  padding-bottom:max(9px, env(safe-area-inset-bottom, 0px));
  border-radius:18px;
  box-shadow:0 -4px 18px rgba(0,0,0,.045);
}
.cs { overflow-wrap:anywhere; }
#lyrics { overscroll-behavior:contain; }
.phead { flex:none; }
.tools { flex:none; gap:6px; }
.tools-r { flex-wrap:wrap; justify-content:flex-end; }
.tools-r .btn { min-height:40px; padding-inline:10px; }
.metro { gap:8px; }
.mbtn { width:50px; height:50px; }
.dots { gap:6px; }
.dots i { width:10px; height:10px; }
.dots i:first-child { width:14px; height:14px; }
.bpmbox { gap:4px; }
.bpmv { min-width:48px; }
.nav { gap:6px; }
.nav .ib { width:44px; height:44px; }
.next { padding-inline:10px; }
.pop {
  max-height: min(88dvh, 760px);
  padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));
}
input, select { min-height:46px; }
textarea { min-height:180px; }
#toast { bottom:calc(90px + env(safe-area-inset-bottom, 0px)); }

<script>
/* ---------- Music theory: chords, transpose, parsing ---------- */
const NOTES_SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTES_FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const BASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const FLAT_KEYS=new Set(['F','Bb','Eb','Ab','Db','Dm','Gm','Cm','Fm','Bbm']);
const QUAL=/^(?:maj|min|dim|aug|sus|add|m|M|\+|-|°|ø|b|#|\d|\(|\)|,)*$/;
const SECTION_WORDS='intro|verse|chorus|pre-?chorus|bridge|tag|outro|interlude|instrumental|ending|refrain|turnaround|vamp|hook|solo|coda';
const SECTION_B=new RegExp('^\\[\\s*(?:'+SECTION_WORDS+')\\b[^\\]]*\\]\\s*:?$','i');
const SECTION_P=new RegExp('^(?:'+SECTION_WORDS+')(?:\\s*\\d+)?\\s*:?$','i');
const META_RE=/^\s*(?:(?:capo|tuning|tuned|key|bpm|tempo|difficulty)\s*:|capo\s+(?:on\s+)?\d)/i;
const SEP=/^[|\/\\\-\u2013\u2014\u2212~>\u2192]+$/;
const NOTE_RE=/^(?:x\d+|\d+x)$/i;

function semi(r){let v=BASE[r[0]];if(r[1]==='#')v++;else if(r[1]==='b')v--;return((v%12)+12)%12;}
function parseChord(s){
  const m=/^([A-G][#b]?)([^\/]*)(?:\/([A-G][#b]?))?$/.exec(String(s).trim());
  if(!m||!QUAL.test(m[2]))return null;
  return {root:m[1],q:m[2],bass:m[3]||null};
}
function trRoot(root,steps,flats){return (flats?NOTES_FLAT:NOTES_SHARP)[((semi(root)+steps)%12+12)%12];}
function trChord(str,steps,flats){
  const c=parseChord(str);if(!c)return str;
  return trRoot(c.root,steps,flats)+c.q+(c.bass?'/'+trRoot(c.bass,steps,flats):'');
}
function isMinorQ(q){return /^m(?!aj)/.test(q);}
function flatsFor(key,steps,pref){
  if(pref==='flat')return true;
  if(pref==='sharp')return false;
  const pc=parseChord(key)||{root:'C',q:''};
  const i=((semi(pc.root)+steps)%12+12)%12;
  return FLAT_KEYS.has(NOTES_FLAT[i]+(isMinorQ(pc.q)?'m':''));
}
function keyName(key,steps,pref){
  const pc=parseChord(key);
  if(!pc)return key;
  if(!steps)return key;
  return trRoot(pc.root,steps,flatsFor(key,steps,pref))+pc.q;
}
function parseBody(body){
  const out=[];
  for(const raw of String(body||'').replace(/\r/g,'').split('\n')){
    const line=raw.replace(/\s+$/,'');
    if(!line.trim()){out.push({t:'gap'});continue;}
    let m=/^\s*#+\s*(.*)$/.exec(line);
    if(m){out.push({t:'sec',x:m[1]});continue;}
    m=/^\s*\[([^\]]+)\]\s*:?\s*$/.exec(line);
    if(m&&!parseChord(m[1])){out.push({t:'sec',x:m[1]});continue;}
    const segs=[];let cur=null;
    for(const p of line.split(/(\[[^\]]+\])/)){
      if(p==='')continue;
      const b=/^\[([^\]]+)\]$/.exec(p);
      if(b&&parseChord(b[1])){cur={chord:b[1].trim(),text:''};segs.push(cur);}
      else if(cur){cur.text=p;cur=null;}
      else segs.push({chord:null,text:p});
    }
    const flat=[];
    for(const s of segs){
      const toks=s.text.match(/\s*\S+\s*|\s+/g)||[''];
      flat.push({chord:s.chord,text:toks[0]});
      for(let i=1;i<toks.length;i++)flat.push({chord:null,text:toks[i]});
    }
    out.push({t:'ln',segs:flat});
  }
  return out;
}
function stripBars(w){return w.replace(/^[|(]+|[|)]+$/g,'');}
function isSectionLine(s){s=String(s).trim();return SECTION_B.test(s)||SECTION_P.test(s);}
/* Reads a line of chords like "Em - D/F# - G   A". Returns null when the line has anything else in it. */
function chordTokens(line){
  const chords=[],notes=[],re=/\S+/g;let m;
  while((m=re.exec(line))){
    const raw=m[0],w=stripBars(raw);
    if(!w||SEP.test(w))continue;
    const off=m.index+raw.indexOf(w);
    if(NOTE_RE.test(w)){notes.push(raw);continue;}
    if(parseChord(w)){chords.push({c:w,i:off});continue;}
    const parts=w.split(/[-–—−]/);
    if(parts.length>1&&parts.every(p=>p&&parseChord(p))){
      let o=off;
      for(const p of parts){chords.push({c:p,i:o});o+=p.length+1;}
      continue;
    }
    return null;
  }
  return chords.length?{chords,notes}:null;
}
function isChordLine(line){return !!String(line).trim()&&!!chordTokens(line);}
function nextWord(l,q){while(q<l.length&&!/\s/.test(l[q]))q++;while(q<l.length&&/\s/.test(l[q]))q++;return q;}
/* Moves a chord to the start of the word it sits on (or the next word when it sits on a gap). */
function snapPos(l,p,lastPos){
  if(p>=l.length)return l.length;
  let q=p;
  if(/\s/.test(l[q])){while(q<l.length&&/\s/.test(l[q]))q++;}
  else{while(q>0&&!/\s/.test(l[q-1]))q--;}
  while(q<l.length&&q<=lastPos)q=nextWord(l,q);
  return q;
}
function looksLikeChordSheet(text){
  let n=0,b=0;
  for(const l of String(text).split('\n')){
    if(isChordLine(l))n++;
    b+=(l.match(/\[[A-G][^\]]*\]/g)||[]).length;
  }
  return n>=2||(n>=1&&b===0);
}
function convertOver(text,opts){
  const snap=!opts||opts.snap!==false;
  const L=String(text).replace(/\r/g,'').split('\n');
  const out=[],dropped=[];
  let changed=false,first=null,metaKey=null;
  for(let i=0;i<L.length;i++){
    const line=L[i];
    const km=/^\s*key\s*:\s*([A-Ga-g][#b]?m?)\s*$/.exec(line);
    if(km&&!metaKey)metaKey=km[1].charAt(0).toUpperCase()+km[1].slice(1);
    if(META_RE.test(line)){out.push(line.replace(/\s+$/,''));continue;}
    const ct=chordTokens(line);
    if(ct){
      if(!first)first=ct.chords[0].c;
      const nxt=L[i+1],lyr=nxt===undefined?'':nxt.replace(/\s+$/,'');
      const note=ct.notes.length?' '+ct.notes.join(' '):'';
      if(lyr.trim()&&!isChordLine(lyr)&&!/^\s*#/.test(lyr)&&!isSectionLine(lyr)&&!META_RE.test(lyr)){
        let res='',last=0,lp=-1;const tail=[];
        for(const t of ct.chords){
          const pos=snap?snapPos(lyr,t.i,lp):Math.min(t.i,lyr.length);
          if(pos>=lyr.length){tail.push(t.c);continue;}
          res+=lyr.slice(last,pos)+'['+t.c+']';last=pos;lp=pos;
        }
        res+=lyr.slice(last);
        res=res.replace(/^\s+/,'');
        if(tail.length)res=res.replace(/\s+$/,'')+' '+tail.map(c=>'['+c+']').join(' ');
        out.push(res+note);i++;changed=true;
      }else{
        out.push(ct.chords.map(t=>'['+t.c+']').join(' ')+note);changed=true;
      }
    }else if(isSectionLine(line)&&!/^\s*#/.test(line)){
      out.push('#'+line.trim().replace(/:$/,'').replace(/^\[|\]$/g,'').trim());changed=true;
    }else out.push(line.replace(/\s+$/,''));
  }
  const clean=[];
  for(const l of out){
    const empty=l.trim()==='';
    if(empty&&(!clean.length||clean[clean.length-1]===''))continue;
    clean.push(empty?'':l);
  }
  while(clean.length&&clean[clean.length-1]==='')clean.pop();
  return {text:clean.join('\n'),changed,dropped,key:metaKey||first};
}
</script>

<script>

`#Verse 1

`#Verse 1

  const set={id:uid(),name:'Sunday Service',items:[{songId:a.id,tr:0,bpm:null},{songId:b.id,tr:2,bpm:76},{songId:c.id,tr:-2,bpm:64}]};
  return {songs:[a,b,c],sets:[set],activeSet:set.id,prefs:{font:20,chords:true,acc:'auto',auto:true}};

function load(){
  let d=null;
  try{const r=localStorage.getItem(STORE);if(r)d=JSON.parse(r);}catch(e){}
  if(!d||!Array.isArray(d.songs)||!Array.isArray(d.sets))d=seed();
  d.prefs=Object.assign({font:20,chords:true,acc:'auto',auto:true,snap:true},d.prefs||{});
  d.sets.forEach(s=>{s.items=(s.items||[]).filter(i=>d.songs.some(x=>x.id===i.songId));});
  return d;
}
function save(){if(U.view==='play')return true;try{localStorage.setItem(STORE,JSON.stringify(S));return true;}catch(e){toast('Could not save. Storage may be full or blocked.');return false;}}
let S=load();
const U={view:'songs',q:'',play:null,from:'songs',editId:null,editFrom:'songs',playSnapshot:null,audioSnapshot:null,confirmAction:null};

function activeSet(){
  let s=S.sets.find(x=>x.id===S.activeSet);
  if(!s){s=S.sets[0];if(!s){s={id:uid(),name:'Sunday Service',items:[]};S.sets.push(s);}S.activeSet=s.id;}
  return s;
}
function ctxItem(){
  const c=U.play;if(!c)return null;
  if(c.setId){
    const set=S.sets.find(x=>x.id===c.setId);const item=set&&set.items[c.idx];
    const song=item&&S.songs.find(x=>x.id===item.songId);
    return song?{song,item,set}:null;
  }
  const song=S.songs.find(x=>x.id===c.songId);
  return song?{song,item:null,set:null}:null;
}
const getTr=x=>(x.item?x.item.tr:x.song.tr)||0;
function setTr(x,v){if(x.item)x.item.tr=v;else x.song.tr=v;save();}
const getBpm=x=>(x.item&&x.item.bpm)||x.song.bpm||90;
function setBpm(x,v){v=clamp(Math.round(v),30,240);if(x.item)x.item.bpm=v;else x.song.bpm=v;save();}

let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}

/* ---------- Metronome ---------- */
let actx=null,mRunning=false,mTimer=null,mNext=0,mBeat=0,mQueue=[],mRaf=0,wl=null;
const AUDIO_PREFS={clickVolume:0.70,spokenVolume:1,clickOn:true,spokenOn:true,language:'en'};
const AUDIO_STORAGE_KEY='worshipCueSheetAudioSettingsV1';
let savedAudioPrefs={...AUDIO_PREFS};
function cloneData(v){return JSON.parse(JSON.stringify(v));}
function playChangesDirty(){return !!U.playSnapshot&&(JSON.stringify(S)!==JSON.stringify(U.playSnapshot)||Object.keys(AUDIO_PREFS).some(k=>AUDIO_PREFS[k]!==U.audioSnapshot[k]));}
function savePlayChanges(){try{localStorage.setItem(STORE,JSON.stringify(S));localStorage.setItem(AUDIO_STORAGE_KEY,JSON.stringify(AUDIO_PREFS));U.playSnapshot=cloneData(S);U.audioSnapshot={...AUDIO_PREFS};savedAudioPrefs={...AUDIO_PREFS};updateSaveButton();toast('Changes saved successfully');return true;}catch(e){toast('Could not save changes on this browser');return false;}}
function discardPlayChanges(){if(U.playSnapshot)S=cloneData(U.playSnapshot);if(U.audioSnapshot)Object.assign(AUDIO_PREFS,U.audioSnapshot);updateMetroUI();}
function updateSaveButton(){const b=$('#save-play-changes');if(!b)return;const dirty=playChangesDirty();b.disabled=!dirty;b.textContent=dirty?'Save Changes':'Saved';b.classList.toggle('primary',dirty);}
function showUnsavedDialog(onSave,onDiscard,onCancel){const ov=$('#overlay');ov.hidden=false;ov.innerHTML='<div class="dialog-backdrop"><section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="unsaved-title"><h2 id="unsaved-title">Unsaved Changes</h2><p>You have unsaved changes to this song. Do you want to save them before leaving?</p><div class="dialog-actions"><button class="btn primary" data-unsaved="save">Save Changes</button><button class="btn danger" data-unsaved="discard">Discard Changes</button><button class="btn" data-unsaved="cancel">Cancel</button></div></section></div>';ov.querySelector('[data-unsaved=save]').onclick=()=>{closeSheet();if(savePlayChanges())onSave();};ov.querySelector('[data-unsaved=discard]').onclick=()=>{closeSheet();discardPlayChanges();onDiscard();};ov.querySelector('[data-unsaved=cancel]').onclick=()=>{closeSheet();onCancel();};}
function normalizeAudioPrefs(p){return {clickVolume:clamp(Number(p.clickVolume??0.70),0,1),spokenVolume:clamp(Number(p.spokenVolume??1),0,1),clickOn:p.clickOn!==false,spokenOn:p.spokenOn!==false,language:p.language==='fil'?'fil':'en'};}
function loadAudioPrefs(){try{const raw=localStorage.getItem(AUDIO_STORAGE_KEY);if(raw){Object.assign(AUDIO_PREFS,normalizeAudioPrefs(JSON.parse(raw)));}}catch(e){}savedAudioPrefs={...AUDIO_PREFS};}
function audioPrefsDirty(){return Object.keys(savedAudioPrefs).some(k=>AUDIO_PREFS[k]!==savedAudioPrefs[k]);}

let voiceBuffers={};
function ensureCtx(){
  if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;actx=new C();}
  if(actx.state==='suspended')actx.resume();
  return actx;
}
function click(t,accent){
  if(!AUDIO_PREFS.clickOn||AUDIO_PREFS.clickVolume<=0)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.value=accent?1300:850;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime((accent?0.18:0.12)*AUDIO_PREFS.clickVolume,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.055);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.06);
}
function decodeClipBase64(s){
  const b=atob(s),a=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
  return a.buffer;
}
async function ensureVoiceBuffers(){
  await Promise.all(Object.keys(VOICE_CLIPS).map(async key=>{
    if(!voiceBuffers[key])voiceBuffers[key]=await actx.decodeAudioData(decodeClipBase64(VOICE_CLIPS[key]).slice(0));
  }));
}
function spokenCount(t,beatIndex){
  if(!AUDIO_PREFS.spokenOn||AUDIO_PREFS.spokenVolume<=0)return;
  const buffer=voiceBuffers[AUDIO_PREFS.language+(beatIndex+1)];
  if(!buffer)return;
  const src=actx.createBufferSource(),gain=actx.createGain();
  src.buffer=buffer;gain.gain.value=AUDIO_PREFS.spokenVolume;
  src.connect(gain);gain.connect(actx.destination);
  // Keep the original sample speed; BPM only schedules when the sample starts.
  src.start(t);
}
function curBpm(){const x=ctxItem();return x?getBpm(x):90;}
function curBeats(){const x=ctxItem();return x?(BEATS[x.song.ts]||4):4;}
function sched(){
  const nb=curBeats();
  while(mNext<actx.currentTime+0.12){
    mBeat%=nb;
    click(mNext,mBeat===0);
    spokenCount(mNext,mBeat%4);
    mQueue.push({t:mNext,b:mBeat});
    mNext+=60/curBpm();
    mBeat=(mBeat+1)%nb;
  }
}
function flash(b){document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('hit',i===b));}
function tick(){
  if(!mRunning)return;
  const now=actx.currentTime;let last=null;
  while(mQueue.length&&mQueue[0].t<=now)last=mQueue.shift();
  if(last)flash(last.b);
  mRaf=requestAnimationFrame(tick);
}
async function metroStart(){
  if(!ensureCtx()){toast('Audio is not available in this browser');return;}
  try{await ensureVoiceBuffers();}catch(e){toast('Spoken count audio could not load');}
  mRunning=true;mBeat=0;mQueue=[];mNext=actx.currentTime+0.08;
  clearInterval(mTimer);mTimer=setInterval(sched,25);
  cancelAnimationFrame(mRaf);mRaf=requestAnimationFrame(tick);
  updateMetroUI();
}
function metroStop(){
  mRunning=false;clearInterval(mTimer);cancelAnimationFrame(mRaf);mQueue=[];
  updateMetroUI();
}
function updateMetroUI(){
  const b=$('#mbtn');
  if(b){b.classList.toggle('on',mRunning);b.innerHTML=mRunning?IC.stop:IC.play;b.setAttribute('aria-label',mRunning?'Stop metronome':'Start metronome');}
  const x=ctxItem(),v=$('#bpmv');
  if(v&&x){v.value=getBpm(x);v.disabled=mRunning;}
  document.querySelectorAll('[data-hold]').forEach(btn=>{btn.disabled=mRunning;});
  const summary=$('#audio-summary');
  if(summary)summary.textContent=(AUDIO_PREFS.clickOn?'Click ON':'Click OFF')+' · '+(AUDIO_PREFS.spokenOn?'Voice ON':'Voice OFF');
  const ct=$('#click-toggle'),st=$('#spoken-toggle');
  if(ct){ct.setAttribute('aria-pressed',String(AUDIO_PREFS.clickOn));ct.querySelector('.toggle-state').textContent=AUDIO_PREFS.clickOn?'ON':'OFF';}
  if(st){st.setAttribute('aria-pressed',String(AUDIO_PREFS.spokenOn));st.querySelector('.toggle-state').textContent=AUDIO_PREFS.spokenOn?'ON':'OFF';}
  const lang=$('#spoken-language');if(lang)lang.value=AUDIO_PREFS.language;
  const cv=$('#click-volume'),sv=$('#spoken-volume');
  if(cv&&document.activeElement!==cv)cv.value=Math.round(AUDIO_PREFS.clickVolume*100);
  if(sv&&document.activeElement!==sv)sv.value=Math.round(AUDIO_PREFS.spokenVolume*100);
  const cl=$('#click-volume-label'),sl=$('#spoken-volume-label');
  if(cl)cl.textContent=Math.round(AUDIO_PREFS.clickVolume*100)+'%';
  if(sl)sl.textContent=Math.round(AUDIO_PREFS.spokenVolume*100)+'%';
  if(!mRunning)document.querySelectorAll('#dots i').forEach(i=>i.classList.remove('hit'));
}
async function wake(){

}

/* ---------- Export / import ---------- */
function downloadJSON(payload,filename){
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function safeFilename(name){return String(name||'untitled').normalize('NFKD').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'untitled';}
function exportSong(songId){
  const song=S.songs.find(x=>x.id===songId);if(!song){toast('Song not found');return;}
  downloadJSON({app:'Worship Cue Sheet',version:1,type:'song',exportedAt:new Date().toISOString(),data:{song}},'worship-song-'+safeFilename(song.title)+'.json');
  toast('Song exported');
}
function exportSetlist(setId){
  const set=S.sets.find(x=>x.id===setId);if(!set){toast('Setlist not found');return;}
  const ids=[...new Set(set.items.map(it=>it.songId))];
  const songs=ids.map(id=>S.songs.find(song=>song.id===id)).filter(Boolean);
  downloadJSON({app:'Worship Cue Sheet',version:1,type:'setlist',exportedAt:new Date().toISOString(),data:{setlist:set,songs}},'worship-setlist-'+safeFilename(set.name)+'.json');
  toast('Setlist exported with '+songs.length+' songs');
}
function exportBackup(){
  downloadJSON({app:'Worship Cue Sheet',version:1,type:'backup',exportedAt:new Date().toISOString(),data:S},'worship-cue-sheet-backup-'+new Date().toISOString().slice(0,10)+'.json');
  toast('Backup exported');
}
function validSong(song){return !!song&&typeof song.id==='string'&&typeof song.title==='string'&&typeof song.body==='string';}
function importFile(file,expectedType){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const raw=JSON.parse(String(reader.result||''));
      const type=raw&&raw.type?raw.type:(raw&&raw.data&&Array.isArray(raw.data.songs)&&Array.isArray(raw.data.sets)?'backup':null);
      const d=raw&&raw.data?raw.data:raw;
      if(expectedType&&type!==expectedType){throw new Error('Wrong file type');}
      if(type==='song'){
        const song=d&&d.song;
        if(!validSong(song))throw new Error('Invalid song');
        const duplicate=S.songs.find(x=>x.title.trim().toLowerCase()===song.title.trim().toLowerCase()&&(x.artist||'').trim().toLowerCase()===(song.artist||'').trim().toLowerCase());
        const incoming=Object.assign({},song);
        if(duplicate){
          if(!window.confirm('A song with the same title and artist already exists. Replace that song’s details? Its existing setlist placements will be kept.'))return;
          incoming.id=duplicate.id;Object.assign(duplicate,incoming);
        }else{incoming.id=uid();delete incoming.sample;S.songs.push(incoming);}
        if(!save())return;U.view='songs';U.play=null;U.editId=null;render();toast(duplicate?'Song updated from import':'Song imported');return;
      }
      if(type==='setlist'){
        const incomingSet=d&&d.setlist, incomingSongs=d&&d.songs;
        if(!incomingSet||typeof incomingSet.name!=='string'||!Array.isArray(incomingSet.items)||!Array.isArray(incomingSongs))throw new Error('Invalid setlist');
        if(!incomingSongs.every(validSong))throw new Error('Invalid songs');
        const songMap=new Map();
        for(const sourceSong of incomingSongs){
          const existing=S.songs.find(x=>x.title.trim().toLowerCase()===sourceSong.title.trim().toLowerCase()&&(x.artist||'').trim().toLowerCase()===(sourceSong.artist||'').trim().toLowerCase());
          if(existing){songMap.set(sourceSong.id,existing.id);}
          else{const copy=Object.assign({},sourceSong,{id:uid()});delete copy.sample;S.songs.push(copy);songMap.set(sourceSong.id,copy.id);}
        }
        const items=incomingSet.items.filter(it=>it&&songMap.has(it.songId)).map(it=>Object.assign({},it,{songId:songMap.get(it.songId)}));
        let name=incomingSet.name||'Imported setlist';
        if(S.sets.some(x=>(x.name||'').trim().toLowerCase()===name.trim().toLowerCase()))name+=' (Imported)';
        const imported={id:uid(),name,items};S.sets.push(imported);S.activeSet=imported.id;
        if(!save())return;U.view='sets';U.play=null;U.editId=null;render();toast('Setlist imported with '+items.length+' songs');return;
      }
      if(type==='backup'||(!type&&d&&Array.isArray(d.songs)&&Array.isArray(d.sets))){
        if(!d||!Array.isArray(d.songs)||!Array.isArray(d.sets))throw new Error('Invalid backup');
        const songIds=new Set();
        for(const song of d.songs){if(!validSong(song))throw new Error('Invalid song data');if(songIds.has(song.id))throw new Error('Duplicate song IDs');songIds.add(song.id);}
        for(const set of d.sets){if(!set||typeof set.id!=='string'||!Array.isArray(set.items))throw new Error('Invalid setlist data');set.items=set.items.filter(it=>it&&songIds.has(it.songId));}
        if(!window.confirm('Import this full backup and REPLACE the songs, setlists, and preferences currently saved on this device? Export a backup first if you want to keep the current data.'))return;
        S={songs:d.songs,sets:d.sets,activeSet:d.activeSet,prefs:Object.assign({font:20,chords:true,acc:'auto',auto:true,snap:true},d.prefs||{})};
        activeSet();if(!save())return;U.view='songs';U.play=null;U.editId=null;U.stage=false;U.q='';render();toast('Full backup restored');return;
      }
      throw new Error('Unsupported file');
    }catch(err){toast(expectedType==='song'?'Import failed: choose a valid song export':expectedType==='setlist'?'Import failed: choose a valid setlist export':'Import failed: invalid or unsupported file');}
  };
  reader.onerror=()=>toast('Could not read that file');reader.readAsText(file);
}
function importBackup(file){importFile(file,null);}
/* ---------- Actions ---------- */
function step(d){
  const x=ctxItem();if(!x||!x.set)return;
  const n=U.play.idx+d;
  if(n<0||n>=x.set.items.length)return;
  U.play.idx=n;
  render();
  if(S.prefs.auto)metroStart();
}
function bump(d){if(mRunning)return;const x=ctxItem();if(!x)return;setBpm(x,getBpm(x)+d);const v=$('#bpmv');if(v)v.textContent=getBpm(x);}
function armed(btn,label,fn){
  if(btn.dataset.armed){fn();return;}
  const old=btn.textContent;btn.dataset.armed='1';btn.textContent=label;
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old;}},3000);
}
let taps=[];
function tapTempo(){
  const n=performance.now();
  if(taps.length&&n-taps[taps.length-1]>2000)taps=[];
  taps.push(n);taps=taps.slice(-6);
  if(taps.length>=2){
    let sum=0;for(let i=1;i<taps.length;i++)sum+=taps[i]-taps[i-1];
    $('#f-bpm').value=clamp(Math.round(60000/(sum/(taps.length-1))),30,240);
  }
}
function setKeyFromChord(c){
  const pc=parseChord(c),sel=$('#f-key');
  if(!pc||!sel)return false;
  if(![...sel.options].some(o=>o.value===pc.root))sel.add(new Option(pc.root,pc.root));
  sel.value=pc.root;
  $('#f-minor').checked=isMinorQ(pc.q);
  return true;
}
function showConvNote(){
  const n=$('#conv-note');if(!n)return;
  const c=U.conv;
  if(!c){n.hidden=true;n.innerHTML='';return;}
  n.innerHTML='<span>'+esc(c.msg)+'</span><span><button class="linkbtn" type="button" data-act="undo-convert">Undo</button><button class="linkbtn" type="button" data-act="reconvert">'+(c.snap?'Redo without snapping':'Redo with snapping')+'</button></span>';
  n.hidden=false;
}
function applyConvert(raw,prefix,suffix,snap,allowKey){
  const r=convertOver(raw,{snap});
  if(!r.changed)return null;
  const ta=$('#f-body');
  ta.value=prefix+r.text+suffix;
  const pos=(prefix+r.text).length;
  try{ta.setSelectionRange(pos,pos);}catch(e){}
  let msg='Converted from a chord sheet.';
  if(allowKey&&r.key&&setKeyFromChord(r.key))msg+=' Key set to '+r.key+'.';
  if(r.dropped.length)msg+=' Skipped '+r.dropped.length+(r.dropped.length===1?' info line.':' info lines.');
  U.conv={prefix,suffix,raw,snap,msg};
  updatePreview();showConvNote();
  return r;
}
function saveSong(){
  const title=$('#f-title').value.trim();
  if(!title){toast('Add a title first');$('#f-title').focus();return;}
  const data={title,artist:$('#f-artist').value.trim(),key:$('#f-key').value+($('#f-minor').checked?'m':''),
    bpm:clamp(parseInt($('#f-bpm').value,10)||90,30,240),ts:$('#f-ts').value,body:$('#f-body').value};
  if(U.editId){
    const s=S.songs.find(x=>x.id===U.editId);Object.assign(s,data);delete s.sample;
    save();toast('Song saved');
    U.view=U.editFrom==='play'?'play':'songs';
    render();return;
  }
  const song=Object.assign({id:uid(),tr:0},data);
  S.songs.push(song);
  if(U.addToSet){
    const s=S.sets.find(x=>x.id===U.addToSet);
    if(s){s.items.push({songId:song.id,tr:0,bpm:null});S.activeSet=s.id;}
    U.addToSet=null;save();
    toast('Song added to '+(s?(s.name||'setlist'):'setlist'));
    U.view='sets';render();return;
  }
  save();U.view='songs';render();
  openSetPicker(song.id,'Song saved. Add it to a setlist?');
}

document.addEventListener('click',e=>{

    case 'tap':tapTempo();break;
    case 'convert':{
      const raw=$('#f-body').value;
      const r=applyConvert(raw,'','',S.prefs.snap,!U.editId);
      toast(r?'Converted to bracket chords':'Nothing to convert');break;
    }
    case 'undo-convert':{
      const c=U.conv;if(!c)break;
      $('#f-body').value=c.prefix+c.raw+c.suffix;
      U.conv=null;updatePreview();showConvNote();toast('Undone');break;
    }
    case 'reconvert':{
      const c=U.conv;if(!c)break;
      S.prefs.snap=!c.snap;save();
      const sw=document.querySelector('[data-act="snap-toggle"]');if(sw)sw.setAttribute('aria-checked',String(S.prefs.snap));
      applyConvert(c.raw,c.prefix,c.suffix,S.prefs.snap,false);break;
    }
    case 'snap-toggle':S.prefs.snap=!S.prefs.snap;save();t.setAttribute('aria-checked',String(S.prefs.snap));break;
    case 'save-song':saveSong();break;
    case 'delete-song':{
      const song=S.songs.find(x=>x.id===U.editId);
      if(!song)break;
      const refs=S.sets.reduce((n,st)=>n+st.items.filter(it=>it.songId===song.id).length,0);
      const extra=refs?' It will also be removed from '+refs+' setlist entr'+(refs===1?'y':'ies')+'.':'';
      if(!window.confirm('Delete “'+song.title+'” permanently?'+extra+' This cannot be undone.'))break;
      const sid=U.editId;
      S.songs=S.songs.filter(x=>x.id!==sid);
      S.sets.forEach(st=>{st.items=st.items.filter(it=>it.songId!==sid);});
      save();toast('Song deleted');U.editId=null;U.stage=false;U.view='songs';render();
      break;
    }
  }
});

let holdT=null,holdI=null;
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-hold]');if(!b)return;
  const d=+b.dataset.hold;bump(d);
  clearTimeout(holdT);clearInterval(holdI);
  holdT=setTimeout(()=>{holdI=setInterval(()=>bump(d),80);},400);
});
['pointerup','pointercancel','contextmenu'].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(holdT);clearInterval(holdI);}));

$('#backup-file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)importFile(f,U.importType||null);U.importType=null;e.target.value='';});

document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='q'){U.q=e.target.value;$('#songlist').innerHTML=songRows();}
  else if(id==='setname'){
    activeSet().name=e.target.value;save();
    const c=document.querySelector('.chip.on');if(c)c.textContent=e.target.value||'Untitled';
  }
  else if(id==='f-body'){updatePreview();if(U.conv){U.conv=null;showConvNote();}}
  else if(id==='sp-q'){U.pickQ=e.target.value;if(U.sheet&&U.sheet.type==='songpick')$('#sp-list').innerHTML=songPickRows(U.sheet.setId);}
});

/* Pasting a chord sheet (chords above the lyrics) into the song editor converts it right away. */
document.addEventListener('paste',e=>{
  const ta=e.target;
  if(!ta||ta.id!=='f-body')return;
  const text=((e.clipboardData&&e.clipboardData.getData('text'))||'').replace(/\r/g,'');
  if(!looksLikeChordSheet(text))return;
  const prefix=ta.value.slice(0,ta.selectionStart),suffix=ta.value.slice(ta.selectionEnd);
  const r=applyConvert(text,prefix,suffix,S.prefs.snap,!U.editId&&(prefix+suffix).trim()==='');
  if(r){e.preventDefault();toast('Chord sheet converted');}
});

loadAudioPrefs();
window.addEventListener('beforeunload',e=>{if(audioPrefsDirty()){e.preventDefault();e.returnValue='';}});
render();
</script>
